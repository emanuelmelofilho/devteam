[program:laravel_queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=60
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/laravel_queue.log

[program:kanban_agents]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/agents/developer_worker.php
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/kanban_agents_developer.log

# add other agents similarly (tester, devops)
